name: Build Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      # Compile against the AOSP API surface because the app accesses ICarrierConfigLoader.
      - name: Install Android platform API
        run: |
          android sdk install platforms/android-34
          curl --fail --location \
            https://raw.githubusercontent.com/Reginer/aosp-android-jar/refs/heads/main/android-34/android.jar \
            --output "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Name APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APK_NAME: ${{ github.ref_name }}-debug.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD > RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s (%h)" > RELEASE_NOTES.md
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: app/build/outputs/apk/debug/${{ github.ref_name }}-debug.apk
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}